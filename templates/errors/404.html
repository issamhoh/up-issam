<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 Not Found — {{ vip_site_name | default('HostX') }}</title>
  <link rel="icon" href="{{ url_for('static', filename='img/logo.svg') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/velohost.css') }}">
</head>
<body class="vh-page" style="display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px;">
  <main class="vh-panel" style="max-width:480px;width:100%;text-align:center;padding:40px 24px;">
    <div style="font-size:3.5rem;margin-bottom:12px;">&#128269;</div>
    <h1 class="vh-page-title" style="font-size:1.75rem;margin-bottom:8px;">Page Not Found</h1>
    <p class="vh-hint" style="margin-bottom:24px;">
      The page or server resource you requested does not exist or has been moved.
    </p>
    <a href="{{ url_for('dashboard') if current_user else url_for('home') }}" class="vh-btn vh-btn-primary">
      &larr; Return to {{ site_name | default('Home') }}
    </a>
  </main>
</body>
</html>
