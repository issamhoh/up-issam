<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="hostxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="50%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer Rounded Shield -->
  <rect x="6" y="6" width="88" height="88" rx="26" fill="url(#hostxGrad)" />
  <rect x="8" y="8" width="84" height="84" rx="24" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="2" />
  
  <!-- Center Hexagon / Cube Grid -->
  <polygon points="50,18 80,35 80,65 50,82 20,65 20,35" fill="rgba(15, 23, 42, 0.45)" stroke="rgba(255,255,255,0.3)" stroke-width="1.5" />
  
  <!-- Modern Lightning Bolt / Spark Core -->
  <path d="M53 25 L34 51 L48 51 L44 75 L67 45 L52 45 Z" fill="url(#boltGrad)" filter="url(#glow)" />
</svg>
